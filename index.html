<!-- Home page for the portfolio site. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Required metadata for encoding and mobile responsiveness. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Bootstrap core CSS for grid/layout/utilities/components. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    
    <!-- Bootstrap Icons for social links in the footer. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Project-specific styling shared across all pages. -->
    <link rel="stylesheet" href="style.css"> 
    <!-- Announces both dark and light theme support to user agents. -->
    <meta name="color-scheme" content="dark light">
    <title>Ean Ostman</title>
</head>
<body class="site-body">
  <!-- Global site navigation used across all top-level pages. -->
    <nav class="navbar navbar-expand-lg">
      <div class="container-fluid">
        <!-- Brand/home link. -->
        <a class="navbar-brand" href="index.html">Ean Ostman</a>
        <!-- Mobile menu toggle for collapsed nav links. -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <!-- Collapsible nav container. -->
        <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
          <!-- Primary page links; Home is marked as current. -->
          <ul class="navbar-nav mx-auto">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="About.html">About me</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="Contact.html">Contact</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    
    <main>
      <!-- Hero section with centered overlay text on top of the cover image. -->
      <div class="position-relative">
        <!-- Intro card uses custom glass styling from .intro-overlay. -->
        <div class="position-absolute top-50 start-50 translate-middle text-white p-4 rounded shadow text-center intro-overlay">
          <h2>Hi I'm Ean Ostman</h2>
          <p>I don't chase hype. I build things that work, learn what matters, and keep moving forward.</p>
        </div>

        <!-- Hero background image with responsive behavior. -->
        <img src="programming.webp" class="img-fluid w-100 cover-image-fullscreen" alt="programming image">
      </div>
    </main>


    <!-- Shared footer with copyright and outbound social links. -->
     <footer class="py-3">
        <div class="container">
          <div class="row align-items-center flex-nowrap">
            <!-- Copyright text centered on all breakpoints. -->
            <div class="col-12 col-md text-center order-2 order-md-1">
              <span>© 2025 Ean Ostman | Portfolio</span>
            </div>
            <!-- Icon-only links include labels/titles for accessibility. -->
            <div class="col-12 col-md-auto text-center text-md-end order-1 order-md-2 mb-2 mb-md-0">
              <a href="https://github.com/eanostman" class="me-3 text-primary text-decoration-none" target="_blank" rel="noopener" aria-label="GitHub profile" title="GitHub">
                <i class="bi bi-github social-icon"></i>
              </a>
              <a href="https://www.linkedin.com/in/eanostman" class="me-3 text-primary" target="_blank" rel="noopener" aria-label="LinkedIn profile" title="LinkedIn">
                <i class="bi bi-linkedin social-icon"></i>
              </a>
            </div>
          </div>
        </div>
      </footer>


      <!-- Bootstrap JS bundle enables navbar collapse and other components. -->
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    
  </body>

  
</html>
